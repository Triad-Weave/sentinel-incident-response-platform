# Dependabot configuration for Sentinel
# Uses the `uv` ecosystem for root Python deps (so uv.lock stays in sync),
# `npm` for /console, `github-actions`, and `docker` for Sentinel's 10 service Dockerfiles.
# Note: platform/* belongs in the shared platform repository and is intentionally excluded here.
version: 2

updates:
  # 1. GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions-patch:
        update-types:
          - "patch"

  # 2. Root Python dependencies (uv ecosystem keeps uv.lock updated)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(uv)"
    groups:
      python-dev-patch:
        dependency-type: "development"
        update-types:
          - "patch"

  # 3. Incident Console (React + TypeScript + Vite)
  - package-ecosystem: "npm"
    directory: "/console"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "console"
    commit-message:
      prefix: "deps(console)"
    groups:
      console-dev-patch:
        dependency-type: "development"
        update-types:
          - "patch"

  # 4. Sentinel's 10 deployable service Dockerfiles (excludes platform/*)
  - package-ecosystem: "docker"
    directories:
      - "/services/orders"
      - "/services/payments"
      - "/services/loadgen"
      - "/chaos/controller"
      - "/sentinel/api"
      - "/sentinel/worker"
      - "/sentinel/mcp_server"
      - "/sentinel/rollback_executor"
      - "/sentinel/restart_executor"
      - "/console"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-base-images:
        update-types:
          - "patch"
