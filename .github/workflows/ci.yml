# Sentinel CI (PB-05)
# Once the shared platform repository publishes its reusable workflow (`cohort-platform/platform`),
# uncomment the `platform-ci` job below (~20 lines) and remove the TEMPORARY build-only job.
#
# Image tagging invariant (FR-CH-03 / PB-05):
# - Images receive ONLY the commit SHA tag (`<service>:<github.sha>`).
# - NEVER tag images with `latest`, branch names, or semver, and NEVER add OCI labels carrying a
#   branch name (a `release/*` branch name would reveal a planted fault).
# - Nothing in this repository pushes images or applies cluster manifests.
name: Sentinel CI

on:
  push:
    branches:
      - main
      - "release/*"
  pull_request:
    branches:
      - main
      - "release/*"
  workflow_dispatch:

concurrency:
  group: sentinel-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # PB-05 Platform Reusable Workflow (enable once cohort-platform/platform exists)
  # ---------------------------------------------------------------------------
  # platform-ci:
  #   uses: cohort-platform/platform/.github/workflows/service-ci.yml@v1
  #   with:
  #     project: sentinel
  #     services: >-
  #       orders,payments,loadgen,chaos-controller,
  #       sentinel-api,sentinel-worker,sentinel-mcp,
  #       rollback-executor,restart-executor,console
  #     python-version: "3.12"
  #     node-version: "22"
  #     tag-with-sha: true
  #   secrets: inherit

  # ---------------------------------------------------------------------------
  # Sentinel verification gate (`make verify-ci`: static, unit + coverage floors,
  # real Postgres testcontainers integration, contract, charts)
  # ---------------------------------------------------------------------------
  verify-ci:
    name: Sentinel Verification (make verify-ci)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history for gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sentinel CI verification
        uses: ./.github/actions/sentinel-verify
        with:
          mode: verify-ci
          report-path: docs/verification-report.md

      - name: Publish verification report to Job Summary
        if: always()
        run: |
          if [[ -f docs/verification-report.md ]]; then
            cat docs/verification-report.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload verification report, JUnit XML & coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-verification-artifacts
          path: |
            docs/verification-report.md
            coverage.xml
            junit-*.xml
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # TEMPORARY until platform CI (PB-05 reusable workflow) is published:
  # Build-only Docker smoke check + Trivy CRITICAL/HIGH CVE scan
  # (NO push, commit SHA tag ONLY, no branch labels).
  # Excludes platform/eval (which belongs in the platform repo).
  # ---------------------------------------------------------------------------
  docker-build-only:
    name: "TEMPORARY until platform CI · Build & Trivy scan (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: verify-ci
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: sentinel-orders
            dockerfile: services/orders/Dockerfile
          - service: sentinel-payments
            dockerfile: services/payments/Dockerfile
          - service: sentinel-loadgen
            dockerfile: services/loadgen/Dockerfile
          - service: sentinel-chaos-controller
            dockerfile: chaos/controller/Dockerfile
          - service: sentinel-api
            dockerfile: sentinel/api/Dockerfile
          - service: sentinel-worker
            dockerfile: sentinel/worker/Dockerfile
          - service: sentinel-mcp
            dockerfile: sentinel/mcp_server/Dockerfile
          - service: sentinel-rollback-executor
            dockerfile: sentinel/rollback_executor/Dockerfile
          - service: sentinel-restart-executor
            dockerfile: sentinel/restart_executor/Dockerfile
          - service: sentinel-console
            dockerfile: console/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (TEMPORARY until platform CI — no push, commit SHA tag only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

      - name: Scan built image with Trivy (CRITICAL/HIGH CVEs block merge)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
