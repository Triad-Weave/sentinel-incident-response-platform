# Release Gate Snapshot Workflow
# On a semver tag (v*.*.*), runs `make verify-ci` and attaches docs/verification-report.md
# plus the latest eval report (if present) to a GitHub Release snapshot.
# Never builds or pushes container images (images come solely from the platform PB-05 CI).
name: Release Workflow

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to snapshot (e.g. v1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-snapshot:
    name: Verify & Publish Gate Snapshot Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: rel
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${REF_NAME}}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid semver tag '${TAG}'. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          PRE="false"
          if [[ "${TAG}" == *"-"* ]]; then
            PRE="true"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRE}" >> "${GITHUB_OUTPUT}"

      - name: Run Sentinel CI verification (make verify-ci)
        uses: ./.github/actions/sentinel-verify
        with:
          mode: verify-ci
          report-path: docs/verification-report.md

      - name: Collect verification report & latest eval report
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-snapshot
          cp docs/verification-report.md release-snapshot/verification-report.md

          LATEST_EVAL="$(
            .venv/bin/python - <<'PY'
          from pathlib import Path
          reports = sorted(Path("eval/reports").glob("*.json"), key=lambda p: p.stat().st_mtime, reverse=True)
          print(reports[0] if reports else "")
          PY
          )"
          if [[ -n "${LATEST_EVAL}" ]]; then
            cp "${LATEST_EVAL}" "release-snapshot/$(basename "${LATEST_EVAL}")"
            echo "eval_report=$(basename "${LATEST_EVAL}")" >> "${GITHUB_OUTPUT}"
          else
            echo "eval_report=none" >> "${GITHUB_OUTPUT}"
          fi
          ls -la release-snapshot

      - name: Ensure release tag exists on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" -m "Sentinel gate snapshot ${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Create GitHub Release with verification & eval reports
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "Sentinel ${{ steps.rel.outputs.tag }}"
          prerelease: ${{ steps.rel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-snapshot/*
          body: |
            ## Sentinel Gate Snapshot ${{ steps.rel.outputs.tag }}

            - Verification evidence: `verification-report.md` (generated by `make verify-ci`)
            - Latest eval report: `${{ steps.collect.outputs.eval_report }}`
            - Container images are built and SHA-tagged exclusively by the platform PB-05 CI workflow; this workflow does not build or push images.
