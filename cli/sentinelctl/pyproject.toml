[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelctl"
version = "0.1.0"
description = "Operator CLI and evaluation harness for Sentinel (FR-CH-02, FR-EV-02, NFR-05)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.13.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
]

[project.scripts]
sentinelctl = "sentinelctl.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinelctl*"]
