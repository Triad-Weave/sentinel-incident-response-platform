<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="508" viewBox="0 0 1060 508" role="img" aria-label="How work moves inside Sentinel. Jobs travel on two RabbitMQ queues; the live timeline travels through the sentinel database, a Postgres NOTIFY and Server-Sent Events." font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How work moves inside Sentinel. Jobs travel on two RabbitMQ queues; the live timeline travels through the sentinel database, a Postgres NOTIFY and Server-Sent Events.</title><style>
.bg{fill:#ffffff}
.zone rect{fill:#f4f6f9;stroke:#d3d9e2;stroke-width:1}
.zone-truth rect{fill:#fdf1f0;stroke:#c23a2c;stroke-width:1.4;stroke-dasharray:6 4}
.zone-sentinel rect{fill:#edf2fc;stroke:#a8bce4}
.zone-group rect{fill:#f7f8fa;stroke:#d3d9e2}
.zone-lane rect{fill:#f6f8fb;stroke:#dce1e8}
.zt{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#5a6576}
.zone-truth .zt{fill:#b3261e}
.zone-sentinel .zt{fill:#2453b8}
.zs{font-size:11px;fill:#6a7585}
.zf{font-size:11px;font-weight:600;fill:#b3261e}
.node rect,.node .shape{fill:#ffffff;stroke:#8e9aab;stroke-width:1.2}
.node .shape-top{fill:none;stroke:#8e9aab;stroke-width:1.2}
.node-agent rect{fill:#e5edfc;stroke:#2453b8;stroke-width:2}
.node-person rect{fill:#ffffff;stroke:#1c2531;stroke-width:1.5}
.node-strip rect{fill:#e8edf5;stroke:#8e9aab;stroke-dasharray:4 3}
.node-queue rect{fill:#f3f0fb;stroke:#7d6bb3}
.node-queue .slots{stroke:#7d6bb3;stroke-width:1.2;opacity:.55}
.node-store .shape{fill:#eef3f8;stroke:#5f7a96}
.node-store .shape-top{fill:none;stroke:#5f7a96}
.node-ext rect{stroke-dasharray:4 3;fill:#fbfbfc}
.node-hot rect{fill:#fdf2e6;stroke:#b45309;stroke-width:2}
.node-ok rect{fill:#ebf6ee;stroke:#2f7d46}
.node-bad rect{fill:#fdf1f0;stroke:#c23a2c}
.nt{font-size:13px;font-weight:600;fill:#1c2531}
.ns{font-size:11px;fill:#5a6576}
.edge path{fill:none;stroke:#5a6576;stroke-width:1.5}
.edge-agent path{stroke:#2453b8;stroke-width:1.8}
.edge-change path{stroke:#b45309;stroke-width:2}
.edge-truth path{stroke:#c23a2c;stroke-dasharray:5 4}
.edge-op path{stroke:#7b8697;stroke-dasharray:6 4}
.is-dashed path,.is-reply path{stroke-dasharray:5 4}
.ah{fill:#5a6576}.ah-agent{fill:#2453b8}.ah-change{fill:#b45309}.ah-truth{fill:#c23a2c}.ah-op{fill:#7b8697}
.el{font-size:11px;fill:#4a5565}
.el-agent{fill:#2453b8}.el-change{fill:#984a0c}.el-truth{fill:#b3261e}.el-op{fill:#5a6576}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.badge circle{fill:#1c2531}.badge text{fill:#ffffff;font-size:10.5px;font-weight:700}
.phase rect{fill:#eef1f5}.phase text{font-size:11.5px;font-weight:600;fill:#344054}.phase .pn{font-weight:700;fill:#1c2531}
.life{stroke:#b9c2ce;stroke-width:1;stroke-dasharray:3 4}
.lg text{font-size:11px;fill:#4a5565}
</style><rect class="bg" x="0" y="0" width="1060" height="508"/><defs><marker id="in-ah-agent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-agent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="in-ah-change" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-change" d="M0,0 L10,5 L0,10 z"/></marker><marker id="in-ah-default" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-default" d="M0,0 L10,5 L0,10 z"/></marker></defs><g class="l-back"><g class="zone zone-lane"><rect x="12" y="12" width="1036" height="340" rx="12"/><text class="zt" x="24" y="32">JOBS</text><text class="zs" x="67" y="32">two RabbitMQ queues · a job is acknowledged only once it is finished</text></g><g class="zone zone-lane"><rect x="12" y="368" width="1036" height="128" rx="12"/><text class="zt" x="24" y="388">LIVE TIMELINE</text><text class="zs" x="143" y="388">sentinel database (Postgres) · a step reaches the browser in about a second</text></g></g><g class="l-mid"><g class="edge edge-default"><path d="M212,92 L372,92" marker-end="url(#in-ah-default)"/></g><g class="edge edge-agent"><path d="M672,92 L848,92" marker-end="url(#in-ah-agent)"/></g><g class="edge edge-change"><path d="M122,128 L122,212 L372,212" marker-end="url(#in-ah-change)"/></g><g class="edge edge-change"><path d="M672,212 L848,212" marker-end="url(#in-ah-change)"/></g><g class="edge edge-change"><path d="M640,248 L640,300 L848,300" marker-end="url(#in-ah-change)"/></g><g class="edge edge-default"><path d="M900,176 L900,152 L620,152 L620,128" marker-end="url(#in-ah-default)"/></g><g class="edge edge-default"><path d="M192,444 L290,444" marker-end="url(#in-ah-default)"/></g><g class="edge edge-default"><path d="M490,444 L588,444" marker-end="url(#in-ah-default)"/></g><g class="edge edge-default"><path d="M758,436 L858,436" marker-end="url(#in-ah-default)"/></g><g class="edge edge-default is-dashed"><path d="M858,454 L758,454" marker-end="url(#in-ah-default)"/></g></g><g class="l-front"><g class="node node-svc" data-node="api"><rect x="32" y="56" width="180" height="72" rx="8"/><text class="nt" x="122.0" y="80.5" text-anchor="middle">sentinel-api</text><text class="ns" x="122.0" y="96.5" text-anchor="middle">opens incidents</text><text class="ns" x="122.0" y="110.5" text-anchor="middle">records decisions</text></g><g class="node node-queue" data-node="q-inv"><rect x="372" y="56" width="300" height="72" rx="8"/><path class="slots" d="M642,68 V116 M650,68 V116 M658,68 V116"/><text class="nt" x="522.0" y="87.5" text-anchor="middle">sentinel.investigations</text><text class="ns" x="522.0" y="103.5" text-anchor="middle">jobs: investigate · verify · postmortem</text></g><g class="node node-agent" data-node="worker"><rect x="848" y="56" width="180" height="72" rx="8"/><text class="nt" x="938.0" y="80.5" text-anchor="middle">sentinel-worker</text><text class="ns" x="938.0" y="96.5" text-anchor="middle">one job at a time</text><text class="ns" x="938.0" y="110.5" text-anchor="middle">scales 1 → 2 on backlog</text></g><g class="node node-queue" data-node="q-act"><rect x="372" y="176" width="300" height="72" rx="8"/><path class="slots" d="M642,188 V236 M650,188 V236 M658,188 V236"/><text class="nt" x="522.0" y="207.5" text-anchor="middle">sentinel.actions</text><text class="ns" x="522.0" y="223.5" text-anchor="middle">approved rollback or restart</text></g><g class="node node-svc" data-node="rollback"><rect x="848" y="176" width="180" height="72" rx="8"/><text class="nt" x="938.0" y="200.5" text-anchor="middle">rollback-executor</text><text class="ns" x="938.0" y="216.5" text-anchor="middle">takes rollbacks</text><text class="ns" x="938.0" y="230.5" text-anchor="middle">claims each one once</text></g><g class="node node-svc" data-node="restart"><rect x="848" y="264" width="180" height="72" rx="8"/><text class="nt" x="938.0" y="288.5" text-anchor="middle">restart-executor</text><text class="ns" x="938.0" y="304.5" text-anchor="middle">takes restarts</text><text class="ns" x="938.0" y="318.5" text-anchor="middle">pods one at a time</text></g><g class="node node-svc" data-node="writers"><rect x="32" y="412" width="160" height="64" rx="8"/><text class="nt" x="112.0" y="439.5" text-anchor="middle">Sentinel services</text><text class="ns" x="112.0" y="455.5" text-anchor="middle">append an event</text></g><g class="node node-store" data-node="events"><path class="shape" d="M290,419 A100.0,7 0 0 1 490,419 V469 A100.0,7 0 0 1 290,469 Z"/><path class="shape-top" d="M290,419 A100.0,7 0 0 0 490,419"/><text class="nt" x="390.0" y="439.5" text-anchor="middle">incident_events</text><text class="ns" x="390.0" y="455.5" text-anchor="middle">append-only, ordered by seq</text></g><g class="node node-svc" data-node="api2"><rect x="588" y="412" width="170" height="64" rx="8"/><text class="nt" x="673.0" y="439.5" text-anchor="middle">sentinel-api</text><text class="ns" x="673.0" y="455.5" text-anchor="middle">one LISTEN connection</text></g><g class="node node-svc" data-node="console"><rect x="858" y="412" width="170" height="64" rx="8"/><text class="nt" x="943.0" y="439.5" text-anchor="middle">Incident console</text><text class="ns" x="943.0" y="455.5" text-anchor="middle">browser EventSource</text></g></g><g class="l-top"><text class="el el-default" x="292" y="84" text-anchor="middle">investigate · postmortem</text><text class="el el-agent" x="760" y="84" text-anchor="middle">take job · ack when done</text><text class="el el-change" x="247" y="204" text-anchor="middle">approved action</text><text class="el el-change" x="247" y="228" text-anchor="middle">sent after the decision is saved</text><text class="el el-change" x="760" y="204" text-anchor="middle">rollback</text><text class="el el-change" x="744" y="292" text-anchor="middle">restart</text><text class="el el-default" x="760" y="168" text-anchor="middle">verify job, after a successful action</text><text class="el el-default" x="380" y="272" text-anchor="start">each queue dead-letters to</text><text class="el el-default" x="380" y="286" text-anchor="start">&lt;name&gt;.dlq after 5 failures</text><text class="el el-default" x="241" y="436" text-anchor="middle">INSERT</text><text class="el el-default" x="539" y="436" text-anchor="middle">pg_notify</text><text class="el el-default" x="539" y="460" text-anchor="middle">id : seq</text><text class="el el-default" x="808" y="428" text-anchor="middle">SSE events</text><text class="el el-default" x="808" y="472" text-anchor="middle">Last-Event-ID</text></g></svg>
