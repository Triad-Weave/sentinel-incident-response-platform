<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Incident lifecycle with eight states. Only an approval leads to a change; every incident ends Resolved." font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Incident lifecycle with eight states. Only an approval leads to a change; every incident ends Resolved.</title><style>
.bg{fill:#ffffff}
.zone rect{fill:#f4f6f9;stroke:#d3d9e2;stroke-width:1}
.zone-truth rect{fill:#fdf1f0;stroke:#c23a2c;stroke-width:1.4;stroke-dasharray:6 4}
.zone-sentinel rect{fill:#edf2fc;stroke:#a8bce4}
.zone-group rect{fill:#f7f8fa;stroke:#d3d9e2}
.zone-lane rect{fill:#f6f8fb;stroke:#dce1e8}
.zt{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#5a6576}
.zone-truth .zt{fill:#b3261e}
.zone-sentinel .zt{fill:#2453b8}
.zs{font-size:11px;fill:#6a7585}
.zf{font-size:11px;font-weight:600;fill:#b3261e}
.node rect,.node .shape{fill:#ffffff;stroke:#8e9aab;stroke-width:1.2}
.node .shape-top{fill:none;stroke:#8e9aab;stroke-width:1.2}
.node-agent rect{fill:#e5edfc;stroke:#2453b8;stroke-width:2}
.node-person rect{fill:#ffffff;stroke:#1c2531;stroke-width:1.5}
.node-strip rect{fill:#e8edf5;stroke:#8e9aab;stroke-dasharray:4 3}
.node-queue rect{fill:#f3f0fb;stroke:#7d6bb3}
.node-queue .slots{stroke:#7d6bb3;stroke-width:1.2;opacity:.55}
.node-store .shape{fill:#eef3f8;stroke:#5f7a96}
.node-store .shape-top{fill:none;stroke:#5f7a96}
.node-ext rect{stroke-dasharray:4 3;fill:#fbfbfc}
.node-hot rect{fill:#fdf2e6;stroke:#b45309;stroke-width:2}
.node-ok rect{fill:#ebf6ee;stroke:#2f7d46}
.node-bad rect{fill:#fdf1f0;stroke:#c23a2c}
.nt{font-size:13px;font-weight:600;fill:#1c2531}
.ns{font-size:11px;fill:#5a6576}
.edge path{fill:none;stroke:#5a6576;stroke-width:1.5}
.edge-agent path{stroke:#2453b8;stroke-width:1.8}
.edge-change path{stroke:#b45309;stroke-width:2}
.edge-truth path{stroke:#c23a2c;stroke-dasharray:5 4}
.edge-op path{stroke:#7b8697;stroke-dasharray:6 4}
.is-dashed path,.is-reply path{stroke-dasharray:5 4}
.ah{fill:#5a6576}.ah-agent{fill:#2453b8}.ah-change{fill:#b45309}.ah-truth{fill:#c23a2c}.ah-op{fill:#7b8697}
.el{font-size:11px;fill:#4a5565}
.el-agent{fill:#2453b8}.el-change{fill:#984a0c}.el-truth{fill:#b3261e}.el-op{fill:#5a6576}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.badge circle{fill:#1c2531}.badge text{fill:#ffffff;font-size:10.5px;font-weight:700}
.phase rect{fill:#eef1f5}.phase text{font-size:11.5px;font-weight:600;fill:#344054}.phase .pn{font-weight:700;fill:#1c2531}
.life{stroke:#b9c2ce;stroke-width:1;stroke-dasharray:3 4}
.lg text{font-size:11px;fill:#4a5565}
</style><rect class="bg" x="0" y="0" width="1200" height="360"/><defs><marker id="lc-ah-change" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-change" d="M0,0 L10,5 L0,10 z"/></marker><marker id="lc-ah-default" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-default" d="M0,0 L10,5 L0,10 z"/></marker></defs><g class="l-back"></g><g class="l-mid"><g class="edge edge-default"><path d="M10,178 L70,178" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-default"><path d="M130,150 L130,96" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-default"><path d="M200,96 L200,150" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-default"><path d="M260,178 L330,178" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-change"><path d="M530,170 L600,170" marker-end="url(#lc-ah-change)"/></g><g class="edge edge-default"><path d="M600,190 L530,190" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-default"><path d="M790,178 L860,178" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-default"><path d="M1010,178 L1060,178" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-default"><path d="M430,206 L430,260" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-default"><path d="M500,206 L500,236 L650,236 L650,260" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-default"><path d="M790,288 L1060,288" marker-end="url(#lc-ah-default)"/></g><g class="edge edge-default"><path d="M430,316 L430,340 L1120,340 L1120,316" marker-end="url(#lc-ah-default)"/></g></g><g class="l-front"><g class="node node-bad" data-node="s-failed"><rect x="70" y="40" width="190" height="56" rx="8"/><text class="nt" x="165.0" y="63.5" text-anchor="middle">Investigation failed</text><text class="ns" x="165.0" y="79.5" text-anchor="middle">reason shown + Retry</text></g><g class="node node-svc" data-node="s-inv"><rect x="70" y="150" width="190" height="56" rx="8"/><text class="nt" x="165.0" y="173.5" text-anchor="middle">Investigating</text><text class="ns" x="165.0" y="189.5" text-anchor="middle">agent loop, live steps</text></g><g class="node node-hot" data-node="s-await"><rect x="330" y="150" width="200" height="56" rx="8"/><text class="nt" x="430.0" y="173.5" text-anchor="middle">Awaiting decision</text><text class="ns" x="430.0" y="189.5" text-anchor="middle">finding + proposed action</text></g><g class="node node-svc" data-node="s-act"><rect x="600" y="150" width="190" height="56" rx="8"/><text class="nt" x="695.0" y="173.5" text-anchor="middle">Action in progress</text><text class="ns" x="695.0" y="189.5" text-anchor="middle">executor running</text></g><g class="node node-ok" data-node="s-mit"><rect x="860" y="150" width="150" height="56" rx="8"/><text class="nt" x="935.0" y="173.5" text-anchor="middle">Mitigated</text><text class="ns" x="935.0" y="189.5" text-anchor="middle">verified healthy</text></g><g class="node node-ok" data-node="s-res"><rect x="1060" y="40" width="120" height="276" rx="8"/><text class="nt" x="1120.0" y="173.5" text-anchor="middle">Resolved</text><text class="ns" x="1120.0" y="189.5" text-anchor="middle">incident closed</text></g><g class="node node-svc" data-node="s-rej"><rect x="330" y="260" width="200" height="56" rx="8"/><text class="nt" x="430.0" y="283.5" text-anchor="middle">Rejected</text><text class="ns" x="430.0" y="299.5" text-anchor="middle">responder handles it</text></g><g class="node node-svc" data-node="s-mon"><rect x="600" y="260" width="190" height="56" rx="8"/><text class="nt" x="695.0" y="283.5" text-anchor="middle">Monitoring</text><text class="ns" x="695.0" y="299.5" text-anchor="middle">no action, watching</text></g></g><g class="l-top"><text class="el el-default" x="40" y="168" text-anchor="middle">new alert</text><text class="el el-default" x="122" y="128" text-anchor="end">error</text><text class="el el-default" x="208" y="128" text-anchor="start">Retry</text><text class="el el-default" x="295" y="170" text-anchor="middle">finding</text><text class="el el-change" x="565" y="162" text-anchor="middle">approved</text><text class="el el-default" x="565" y="206" text-anchor="middle">failed</text><text class="el el-default" x="825" y="170" text-anchor="middle">verified</text><text class="el el-default" x="1035" y="170" text-anchor="middle">2 min</text><text class="el el-default" x="438" y="238" text-anchor="start">rejected</text><text class="el el-default" x="575" y="230" text-anchor="middle">“none” approved</text><text class="el el-default" x="925" y="280" text-anchor="middle">alerts resolved for 2 min</text><text class="el el-default" x="820" y="334" text-anchor="middle">after its alerts resolve, or closed by a responder</text></g></svg>
