<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="808" viewBox="0 0 1200 808" role="img" aria-label="Sentinel architecture. Top: the shop Sentinel watches and the walled-off ground truth. Middle: the shared platform. Bottom: the Sentinel services. The agent only reads; every change starts with a person&#x27;s approval and runs through the platform rollback." font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Sentinel architecture. Top: the shop Sentinel watches and the walled-off ground truth. Middle: the shared platform. Bottom: the Sentinel services. The agent only reads; every change starts with a person&#x27;s approval and runs through the platform rollback.</title><style>
.bg{fill:#ffffff}
.zone rect{fill:#f4f6f9;stroke:#d3d9e2;stroke-width:1}
.zone-truth rect{fill:#fdf1f0;stroke:#c23a2c;stroke-width:1.4;stroke-dasharray:6 4}
.zone-sentinel rect{fill:#edf2fc;stroke:#a8bce4}
.zone-group rect{fill:#f7f8fa;stroke:#d3d9e2}
.zone-lane rect{fill:#f6f8fb;stroke:#dce1e8}
.zt{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#5a6576}
.zone-truth .zt{fill:#b3261e}
.zone-sentinel .zt{fill:#2453b8}
.zs{font-size:11px;fill:#6a7585}
.zf{font-size:11px;font-weight:600;fill:#b3261e}
.node rect,.node .shape{fill:#ffffff;stroke:#8e9aab;stroke-width:1.2}
.node .shape-top{fill:none;stroke:#8e9aab;stroke-width:1.2}
.node-agent rect{fill:#e5edfc;stroke:#2453b8;stroke-width:2}
.node-person rect{fill:#ffffff;stroke:#1c2531;stroke-width:1.5}
.node-strip rect{fill:#e8edf5;stroke:#8e9aab;stroke-dasharray:4 3}
.node-queue rect{fill:#f3f0fb;stroke:#7d6bb3}
.node-queue .slots{stroke:#7d6bb3;stroke-width:1.2;opacity:.55}
.node-store .shape{fill:#eef3f8;stroke:#5f7a96}
.node-store .shape-top{fill:none;stroke:#5f7a96}
.node-ext rect{stroke-dasharray:4 3;fill:#fbfbfc}
.node-hot rect{fill:#fdf2e6;stroke:#b45309;stroke-width:2}
.node-ok rect{fill:#ebf6ee;stroke:#2f7d46}
.node-bad rect{fill:#fdf1f0;stroke:#c23a2c}
.nt{font-size:13px;font-weight:600;fill:#1c2531}
.ns{font-size:11px;fill:#5a6576}
.edge path{fill:none;stroke:#5a6576;stroke-width:1.5}
.edge-agent path{stroke:#2453b8;stroke-width:1.8}
.edge-change path{stroke:#b45309;stroke-width:2}
.edge-truth path{stroke:#c23a2c;stroke-dasharray:5 4}
.edge-op path{stroke:#7b8697;stroke-dasharray:6 4}
.is-dashed path,.is-reply path{stroke-dasharray:5 4}
.ah{fill:#5a6576}.ah-agent{fill:#2453b8}.ah-change{fill:#b45309}.ah-truth{fill:#c23a2c}.ah-op{fill:#7b8697}
.el{font-size:11px;fill:#4a5565}
.el-agent{fill:#2453b8}.el-change{fill:#984a0c}.el-truth{fill:#b3261e}.el-op{fill:#5a6576}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.badge circle{fill:#1c2531}.badge text{fill:#ffffff;font-size:10.5px;font-weight:700}
.phase rect{fill:#eef1f5}.phase text{font-size:11.5px;font-weight:600;fill:#344054}.phase .pn{font-weight:700;fill:#1c2531}
.life{stroke:#b9c2ce;stroke-width:1;stroke-dasharray:3 4}
.lg text{font-size:11px;fill:#4a5565}
</style><rect class="bg" x="0" y="0" width="1200" height="808"/><defs><marker id="ov-ah-agent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-agent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ov-ah-change" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-change" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ov-ah-default" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-default" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ov-ah-op" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-op" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ov-ah-truth" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-truth" d="M0,0 L10,5 L0,10 z"/></marker></defs><g class="l-back"><g class="zone zone-truth"><rect x="24" y="84" width="176" height="164" rx="12"/><text class="zt" x="36" y="104">GROUND TRUTH</text><text class="zs" x="36" y="119">ns sentinel-chaos</text><text class="zf" x="112" y="236" text-anchor="middle">no route from Sentinel</text></g><g class="zone zone-shop"><rect x="264" y="84" width="684" height="164" rx="12"/><text class="zt" x="276" y="104">TARGET SYSTEM</text><text class="zs" x="276" y="119">ns shop · the two services Sentinel watches</text></g><g class="zone zone-group"><rect x="984" y="84" width="192" height="344" rx="12"/><text class="zt" x="996" y="104">DELIVERY</text><text class="zs" x="996" y="119">platform</text></g><g class="zone zone-group"><rect x="32" y="296" width="560" height="132" rx="12"/><text class="zt" x="44" y="316">OBSERVABILITY</text><text class="zs" x="44" y="331">platform · also OTel collector and eval store</text></g><g class="zone zone-group"><rect x="608" y="296" width="176" height="132" rx="12"/><text class="zt" x="620" y="316">SHARED SERVICES</text><text class="zs" x="620" y="331">+ Postgres, RabbitMQ</text></g><g class="zone zone-sentinel"><rect x="24" y="476" width="1152" height="224" rx="12"/><text class="zt" x="36" y="496">SENTINEL</text><text class="zs" x="113" y="496">namespace sentinel · the AI on-call engineer</text></g></g><g class="l-mid"><g class="edge edge-op" data-steps="0"><path d="M200,35 L1060,35 L1060,136" marker-end="url(#ov-ah-op)"/></g><g class="edge edge-op" data-steps="0"><path d="M176,60 L176,136" marker-end="url(#ov-ah-op)"/></g><g class="edge edge-truth" data-steps="0"><path d="M264,172 L188,172" marker-end="url(#ov-ah-truth)"/></g><g class="edge edge-default" data-steps="1"><path d="M428,172 L460,172" marker-end="url(#ov-ah-default)"/></g><g class="edge edge-default" data-steps="1"><path d="M612,172 L644,172" marker-end="url(#ov-ah-default)"/></g><g class="edge edge-default" data-steps="1"><path d="M536,248 L536,340" marker-end="url(#ov-ah-default)"/></g><g class="edge edge-default" data-steps="2"><path d="M424,376 L392,376" marker-end="url(#ov-ah-default)"/></g><g class="edge edge-default" data-steps="2"><path d="M312,412 L312,516" marker-end="url(#ov-ah-default)"/></g><g class="edge edge-default" data-steps="3 6 7"><path d="M312,588 L312,616" marker-end="url(#ov-ah-default)" marker-start="url(#ov-ah-default)"/></g><g class="edge edge-default" data-steps="3 6 9"><path d="M696,588 L696,616" marker-end="url(#ov-ah-default)" marker-start="url(#ov-ah-default)"/></g><g class="edge edge-agent" data-steps="4 9"><path d="M616,552 L584,552" marker-end="url(#ov-ah-agent)"/></g><g class="edge edge-agent" data-steps="4 9"><path d="M504,516 L504,412" marker-end="url(#ov-ah-agent)"/></g><g class="edge edge-agent" data-steps="5"><path d="M696,516 L696,412" marker-end="url(#ov-ah-agent)"/></g><g class="edge edge-default" data-steps="6 7"><path d="M200,552 L232,552" marker-end="url(#ov-ah-default)" marker-start="url(#ov-ah-default)"/></g><g class="edge edge-change" data-steps="7"><path d="M120,736 L120,588" marker-end="url(#ov-ah-change)"/></g><g class="edge edge-change" data-steps="7 8"><path d="M888,588 L888,616" marker-end="url(#ov-ah-change)" marker-start="url(#ov-ah-change)"/></g><g class="edge edge-change" data-steps="7 8 9"><path d="M1080,588 L1080,616" marker-end="url(#ov-ah-change)" marker-start="url(#ov-ah-change)"/></g><g class="edge edge-change" data-steps="8"><path d="M1080,516 L1080,412" marker-end="url(#ov-ah-change)"/></g><g class="edge edge-change" data-steps="8"><path d="M1040,340 L1040,208" marker-end="url(#ov-ah-change)"/></g><g class="edge edge-change" data-steps="8"><path d="M992,172 L948,172" marker-end="url(#ov-ah-change)"/></g><g class="edge edge-change is-dashed" data-steps="8"><path d="M888,516 L888,248" marker-end="url(#ov-ah-change)"/></g></g><g class="l-front"><g class="node node-person" data-node="operator" data-steps="0" tabindex="0" role="button" aria-label="Operator: runs sentinelctl"><rect x="24" y="10" width="176" height="50" rx="25"/><text class="nt" x="112.0" y="30.5" text-anchor="middle">Operator</text><text class="ns" x="112.0" y="46.5" text-anchor="middle">runs sentinelctl</text></g><g class="node node-svc" data-node="chaos" data-steps="0" tabindex="0" role="button" aria-label="chaos-controller: faults + answer key, own DB: chaos"><rect x="36" y="136" width="152" height="72" rx="8"/><text class="nt" x="112.0" y="160.5" text-anchor="middle">chaos-controller</text><text class="ns" x="112.0" y="176.5" text-anchor="middle">faults + answer key</text><text class="ns" x="112.0" y="190.5" text-anchor="middle">own DB: chaos</text></g><g class="node node-svc" data-node="loadgen" data-steps="1" tabindex="0" role="button" aria-label="Load generator: 10 requests / s, fixed seed 42"><rect x="284" y="136" width="144" height="72" rx="8"/><text class="nt" x="356.0" y="160.5" text-anchor="middle">Load generator</text><text class="ns" x="356.0" y="176.5" text-anchor="middle">10 requests / s</text><text class="ns" x="356.0" y="190.5" text-anchor="middle">fixed seed 42</text></g><g class="node node-svc" data-node="orders" data-steps="0 1 8 9" tabindex="0" role="button" aria-label="Orders: API + faultkit, own DB: orders"><rect x="460" y="136" width="152" height="72" rx="8"/><text class="nt" x="536.0" y="160.5" text-anchor="middle">Orders</text><text class="ns" x="536.0" y="176.5" text-anchor="middle">API + faultkit</text><text class="ns" x="536.0" y="190.5" text-anchor="middle">own DB: orders</text></g><g class="node node-svc" data-node="payments" data-steps="0 1" tabindex="0" role="button" aria-label="Payments: card auth + faultkit, own DB: payments"><rect x="644" y="136" width="152" height="72" rx="8"/><text class="nt" x="720.0" y="160.5" text-anchor="middle">Payments</text><text class="ns" x="720.0" y="176.5" text-anchor="middle">card auth + faultkit</text><text class="ns" x="720.0" y="190.5" text-anchor="middle">own DB: payments</text></g><g class="node node-svc" data-node="gitops" data-steps="0 8" tabindex="0" role="button" aria-label="Git + Argo CD: release.yaml pins, each service version"><rect x="992" y="136" width="176" height="72" rx="8"/><text class="nt" x="1080.0" y="160.5" text-anchor="middle">Git + Argo CD</text><text class="ns" x="1080.0" y="176.5" text-anchor="middle">release.yaml pins</text><text class="ns" x="1080.0" y="190.5" text-anchor="middle">each service version</text></g><g class="node node-svc" data-node="grafana" data-steps="" tabindex="0" role="button" aria-label="Grafana: dashboards, incl. eval history"><rect x="40" y="340" width="160" height="72" rx="8"/><text class="nt" x="120.0" y="364.5" text-anchor="middle">Grafana</text><text class="ns" x="120.0" y="380.5" text-anchor="middle">dashboards</text><text class="ns" x="120.0" y="394.5" text-anchor="middle">incl. eval history</text></g><g class="node node-svc" data-node="alertmanager" data-steps="2" tabindex="0" role="button" aria-label="Alertmanager: routes alerts by, project label"><rect x="232" y="340" width="160" height="72" rx="8"/><text class="nt" x="312.0" y="364.5" text-anchor="middle">Alertmanager</text><text class="ns" x="312.0" y="380.5" text-anchor="middle">routes alerts by</text><text class="ns" x="312.0" y="394.5" text-anchor="middle">project label</text></g><g class="node node-svc" data-node="promloki" data-steps="1 2 4 9" tabindex="0" role="button" aria-label="Prometheus · Loki: metrics, 15 s scrape, JSON logs"><rect x="424" y="340" width="160" height="72" rx="8"/><text class="nt" x="504.0" y="364.5" text-anchor="middle">Prometheus · Loki</text><text class="ns" x="504.0" y="380.5" text-anchor="middle">metrics, 15 s scrape</text><text class="ns" x="504.0" y="394.5" text-anchor="middle">JSON logs</text></g><g class="node node-svc" data-node="llm" data-steps="5" tabindex="0" role="button" aria-label="LLM gateway: only path to models, budget · cost per call"><rect x="616" y="340" width="160" height="72" rx="8"/><text class="nt" x="696.0" y="364.5" text-anchor="middle">LLM gateway</text><text class="ns" x="696.0" y="380.5" text-anchor="middle">only path to models</text><text class="ns" x="696.0" y="394.5" text-anchor="middle">budget · cost per call</text></g><g class="node node-svc" data-node="pb07" data-steps="8" tabindex="0" role="button" aria-label="Rollback controller: PB-07 · only Git writer, serves deploy history"><rect x="992" y="340" width="176" height="72" rx="8"/><text class="nt" x="1080.0" y="364.5" text-anchor="middle">Rollback controller</text><text class="ns" x="1080.0" y="380.5" text-anchor="middle">PB-07 · only Git writer</text><text class="ns" x="1080.0" y="394.5" text-anchor="middle">serves deploy history</text></g><g class="node node-svc" data-node="console" data-steps="6 7" tabindex="0" role="button" aria-label="Incident console: live timeline, approve or reject"><rect x="40" y="516" width="160" height="72" rx="8"/><text class="nt" x="120.0" y="540.5" text-anchor="middle">Incident console</text><text class="ns" x="120.0" y="556.5" text-anchor="middle">live timeline</text><text class="ns" x="120.0" y="570.5" text-anchor="middle">approve or reject</text></g><g class="node node-svc" data-node="api" data-steps="2 3 6 7" tabindex="0" role="button" aria-label="sentinel-api: alerts · REST · SSE, sign-in · approvals"><rect x="232" y="516" width="160" height="72" rx="8"/><text class="nt" x="312.0" y="540.5" text-anchor="middle">sentinel-api</text><text class="ns" x="312.0" y="556.5" text-anchor="middle">alerts · REST · SSE</text><text class="ns" x="312.0" y="570.5" text-anchor="middle">sign-in · approvals</text></g><g class="node node-svc" data-node="mcp" data-steps="4 9" tabindex="0" role="button" aria-label="sentinel-mcp: 6 read-only tools, redacts every result"><rect x="424" y="516" width="160" height="72" rx="8"/><text class="nt" x="504.0" y="540.5" text-anchor="middle">sentinel-mcp</text><text class="ns" x="504.0" y="556.5" text-anchor="middle">6 read-only tools</text><text class="ns" x="504.0" y="570.5" text-anchor="middle">redacts every result</text></g><g class="node node-agent" data-node="worker" data-steps="3 4 5 6 9" tabindex="0" role="button" aria-label="sentinel-worker: the AI investigator, triage + tool loop"><rect x="616" y="516" width="160" height="72" rx="8"/><text class="nt" x="696.0" y="540.5" text-anchor="middle">sentinel-worker</text><text class="ns" x="696.0" y="556.5" text-anchor="middle">the AI investigator</text><text class="ns" x="696.0" y="570.5" text-anchor="middle">triage + tool loop</text></g><g class="node node-svc" data-node="restart" data-steps="8" tabindex="0" role="button" aria-label="restart-executor: deletes shop pods, one at a time"><rect x="808" y="516" width="160" height="72" rx="8"/><text class="nt" x="888.0" y="540.5" text-anchor="middle">restart-executor</text><text class="ns" x="888.0" y="556.5" text-anchor="middle">deletes shop pods</text><text class="ns" x="888.0" y="570.5" text-anchor="middle">one at a time</text></g><g class="node node-svc" data-node="rollback" data-steps="7 8 9" tabindex="0" role="button" aria-label="rollback-executor: files RollbackRequest, holds no Git key"><rect x="992" y="516" width="176" height="72" rx="8"/><text class="nt" x="1080.0" y="540.5" text-anchor="middle">rollback-executor</text><text class="ns" x="1080.0" y="556.5" text-anchor="middle">files RollbackRequest</text><text class="ns" x="1080.0" y="570.5" text-anchor="middle">holds no Git key</text></g><g class="node node-strip" data-node="handoff" data-steps="3 6 7 9" tabindex="0" role="button" aria-label="Hand-offs: RabbitMQ work queues + the sentinel database (platform Postgres): jobs → worker  ·  approved actions → executors  ·  every saved step → NOTIFY → live timeline in the console"><rect x="232" y="616" width="936" height="64" rx="8"/><text class="nt" x="248.0" y="643.5" text-anchor="start">Hand-offs: RabbitMQ work queues + the sentinel database (platform Postgres)</text><text class="ns" x="248.0" y="659.5" text-anchor="start">jobs → worker  ·  approved actions → executors  ·  every saved step → NOTIFY → live timeline in the console</text></g><g class="node node-person" data-node="responder" data-steps="7" tabindex="0" role="button" aria-label="Responder: approves with a reason"><rect x="40" y="736" width="160" height="52" rx="26"/><text class="nt" x="120.0" y="757.5" text-anchor="middle">Responder</text><text class="ns" x="120.0" y="773.5" text-anchor="middle">approves with a reason</text></g></g><g class="l-top"><text class="el el-op" x="630" y="27" text-anchor="middle" data-steps="0">ship a release: commit release.yaml</text><text class="el el-op" x="186" y="79" text-anchor="start" data-steps="0">inject / clear faults</text><text class="el el-truth" x="232" y="162" text-anchor="middle" data-steps="0">polls</text><text class="el el-truth" x="232" y="190" text-anchor="middle" data-steps="0">every 2 s</text><text class="el el-default" x="552" y="276" text-anchor="start" data-steps="1">metrics + JSON logs</text><g class="badge" data-steps="1"><circle cx="536" cy="272" r="9"/><text x="536" y="275.7" text-anchor="middle">1</text></g><text class="el el-default" x="326" y="456" text-anchor="start" data-steps="2">alert webhook</text><g class="badge" data-steps="2"><circle cx="312" cy="452" r="9"/><text x="312" y="455.7" text-anchor="middle">2</text></g><g class="badge" data-steps="3"><circle cx="714" cy="602" r="9"/><text x="714" y="605.7" text-anchor="middle">3</text></g><g class="badge" data-steps="4"><circle cx="600" cy="534" r="9"/><text x="600" y="537.7" text-anchor="middle">4</text></g><text class="el el-agent" x="514" y="456" text-anchor="start" data-steps="4 9">read-only queries</text><text class="el el-agent" x="716" y="456" text-anchor="start" data-steps="5">model calls</text><g class="badge" data-steps="5"><circle cx="696" cy="452" r="9"/><text x="696" y="455.7" text-anchor="middle">5</text></g><g class="badge" data-steps="6"><circle cx="216" cy="534" r="9"/><text x="216" y="537.7" text-anchor="middle">6</text></g><text class="el el-change" x="136" y="722" text-anchor="start" data-steps="7">approve / reject</text><g class="badge" data-steps="7"><circle cx="120" cy="718" r="9"/><text x="120" y="721.7" text-anchor="middle">7</text></g><text class="el el-change" x="1064" y="456" text-anchor="end" data-steps="8">RollbackRequest</text><g class="badge" data-steps="8"><circle cx="1080" cy="452" r="9"/><text x="1080" y="455.7" text-anchor="middle">8</text></g><text class="el el-change" x="1050" y="278" text-anchor="start" data-steps="8">reverts 1 commit</text><text class="el el-change" x="938" y="164" text-anchor="end" data-steps="8">sync ≤ 30 s</text><text class="el el-change" x="898" y="352" text-anchor="start" data-steps="8">restart path</text><text class="el el-change" x="898" y="366" text-anchor="start" data-steps="8">deletes pods</text><text class="el el-change" x="898" y="380" text-anchor="start" data-steps="8">via K8s API</text><g class="lg"><g class="edge edge-agent"><path d="M560,748 L588,748"/></g><text x="596" y="752">agent's read-only calls</text><g class="edge edge-truth"><path d="M560,774 L588,774"/></g><text x="596" y="778">ground truth: no route from Sentinel</text><g class="edge edge-change"><path d="M860,748 L888,748"/></g><text x="896" y="752">change path: starts with an approval</text><g class="badge"><circle cx="874" cy="774" r="9"/><text x="874" y="777.7" text-anchor="middle">1</text></g><text x="896" y="778">steps of one incident (see list)</text></g></g></svg>
