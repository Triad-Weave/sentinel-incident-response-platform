<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Sequence for the demo story: a bad Orders release ships, Sentinel investigates on its own, a responder approves the rollback, and the platform rolls Orders back." font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Sequence for the demo story: a bad Orders release ships, Sentinel investigates on its own, a responder approves the rollback, and the platform rolls Orders back.</title><style>
.bg{fill:#ffffff}
.zone rect{fill:#f4f6f9;stroke:#d3d9e2;stroke-width:1}
.zone-truth rect{fill:#fdf1f0;stroke:#c23a2c;stroke-width:1.4;stroke-dasharray:6 4}
.zone-sentinel rect{fill:#edf2fc;stroke:#a8bce4}
.zone-group rect{fill:#f7f8fa;stroke:#d3d9e2}
.zone-lane rect{fill:#f6f8fb;stroke:#dce1e8}
.zt{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#5a6576}
.zone-truth .zt{fill:#b3261e}
.zone-sentinel .zt{fill:#2453b8}
.zs{font-size:11px;fill:#6a7585}
.zf{font-size:11px;font-weight:600;fill:#b3261e}
.node rect,.node .shape{fill:#ffffff;stroke:#8e9aab;stroke-width:1.2}
.node .shape-top{fill:none;stroke:#8e9aab;stroke-width:1.2}
.node-agent rect{fill:#e5edfc;stroke:#2453b8;stroke-width:2}
.node-person rect{fill:#ffffff;stroke:#1c2531;stroke-width:1.5}
.node-strip rect{fill:#e8edf5;stroke:#8e9aab;stroke-dasharray:4 3}
.node-queue rect{fill:#f3f0fb;stroke:#7d6bb3}
.node-queue .slots{stroke:#7d6bb3;stroke-width:1.2;opacity:.55}
.node-store .shape{fill:#eef3f8;stroke:#5f7a96}
.node-store .shape-top{fill:none;stroke:#5f7a96}
.node-ext rect{stroke-dasharray:4 3;fill:#fbfbfc}
.node-hot rect{fill:#fdf2e6;stroke:#b45309;stroke-width:2}
.node-ok rect{fill:#ebf6ee;stroke:#2f7d46}
.node-bad rect{fill:#fdf1f0;stroke:#c23a2c}
.nt{font-size:13px;font-weight:600;fill:#1c2531}
.ns{font-size:11px;fill:#5a6576}
.edge path{fill:none;stroke:#5a6576;stroke-width:1.5}
.edge-agent path{stroke:#2453b8;stroke-width:1.8}
.edge-change path{stroke:#b45309;stroke-width:2}
.edge-truth path{stroke:#c23a2c;stroke-dasharray:5 4}
.edge-op path{stroke:#7b8697;stroke-dasharray:6 4}
.is-dashed path,.is-reply path{stroke-dasharray:5 4}
.ah{fill:#5a6576}.ah-agent{fill:#2453b8}.ah-change{fill:#b45309}.ah-truth{fill:#c23a2c}.ah-op{fill:#7b8697}
.el{font-size:11px;fill:#4a5565}
.el-agent{fill:#2453b8}.el-change{fill:#984a0c}.el-truth{fill:#b3261e}.el-op{fill:#5a6576}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.badge circle{fill:#1c2531}.badge text{fill:#ffffff;font-size:10.5px;font-weight:700}
.phase rect{fill:#eef1f5}.phase text{font-size:11.5px;font-weight:600;fill:#344054}.phase .pn{font-weight:700;fill:#1c2531}
.life{stroke:#b9c2ce;stroke-width:1;stroke-dasharray:3 4}
.lg text{font-size:11px;fill:#4a5565}
</style><rect class="bg" x="0" y="0" width="1200" height="780"/><defs><marker id="sq-ah-agent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-agent" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sq-ah-change" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-change" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sq-ah-default" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah ah-default" d="M0,0 L10,5 L0,10 z"/></marker></defs><g class="l-back"><line class="life" x1="72" y1="60" x2="72" y2="770"/><line class="life" x1="202" y1="60" x2="202" y2="770"/><line class="life" x1="332" y1="60" x2="332" y2="770"/><line class="life" x1="462" y1="60" x2="462" y2="770"/><line class="life" x1="592" y1="60" x2="592" y2="770"/><line class="life" x1="722" y1="60" x2="722" y2="770"/><line class="life" x1="852" y1="60" x2="852" y2="770"/><line class="life" x1="982" y1="60" x2="982" y2="770"/><line class="life" x1="1112" y1="60" x2="1112" y2="770"/><g class="phase"><rect x="12" y="74" width="1176" height="22" rx="6"/><text class="pn" x="24" y="89">1</text><text x="42" y="89">A bad release ships: the operator commits orders 1.4.0 to release.yaml</text></g><g class="phase"><rect x="12" y="194" width="1176" height="22" rx="6"/><text class="pn" x="24" y="209">2</text><text x="42" y="209">Sentinel investigates with no human input (target: a finding within 3 minutes)</text></g><g class="phase"><rect x="12" y="538" width="1176" height="22" rx="6"/><text class="pn" x="24" y="553">3</text><text x="42" y="553">A person approves; the platform rolls Orders back</text></g></g><g class="l-mid"><g class="edge edge-default"><path d="M202,120 L332,120" marker-end="url(#sq-ah-default)"/></g><g class="edge edge-defaul