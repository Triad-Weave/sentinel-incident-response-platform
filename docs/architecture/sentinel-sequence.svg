t" x="72.0" y="32.5" text-anchor="middle">Executor</text><text class="ns" x="72.0" y="48.5" text-anchor="middle">rollback-executor</text></g><g class="node node-svc" data-node="h-git"><rect x="144" y="14" width="116" height="46" rx="8"/><text class="nt" x="202.0" y="32.5" text-anchor="middle">GitOps</text><text class="ns" x="202.0" y="48.5" text-anchor="middle">Argo CD · PB-07</text></g><g class="node node-svc" data-node="h-orders"><rect x="274" y="14" width="116" height="46" rx="8"/><text class="nt" x="332.0" y="32.5" text-anchor="middle">Orders</text><text class="ns" x="332.0" y="48.5" text-anchor="middle">shop</text></g><g class="node node-svc" data-node="h-alert"><rect x="404" y="14" width="116" height="46" rx="8"/><text class="nt" x="462.0" y="32.5" text-anchor="middle">Alerting</text><text class="ns" x="462.0" y="48.5" text-anchor="middle">Prometheus, AM</text></g><g class="node node-svc" data-node="h-api"><rect x="534" y="14" width="116" height="46" rx="8"/><text class="nt" x="592.0" y="32.5" text-anchor="middle">API</text><text class="ns" x="592.0" y="48.5" text-anchor="middle">sentinel-api</text></g><g class="node node-person" data-node="h-resp"><rect x="664" y="14" width="116" height="46" rx="23"/><text class="nt" x="722.0" y="32.5" text-anchor="middle">Responder</text><text class="ns" x="722.0" y="48.5" text-anchor="middle">in the console</text></g><g class="node node-agent" data-node="h-agent"><rect x="794" y="14" width="116" height="46" rx="8"/><text class="nt" x="852.0" y="32.5" text-anchor="middle">Agent</text><text class="ns" x="852.0" y="48.5" text-anchor="middle">sentinel-worker</text></g><g class="node node-svc" data-node="h-mcp"><rect x="924" y="14" width="116" height="46" rx="8"/><text class="nt" x="982.0" y="32.5" text-anchor="middle">MCP tools</text><text class="ns" x="982.0" y="48.5" text-anchor="middle">sentinel-mcp</text></g><g class="node node-svc" data-node="h-llm"><rect x="1054" y="14" width="116" height="46" rx="8"/><text class="nt" x="