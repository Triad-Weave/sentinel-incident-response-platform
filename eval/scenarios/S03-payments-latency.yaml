id: S03-payments-latency
description: Payments slows down (+900 ms); Orders shows the symptom too via upstream calls.
setup:
  baseline_minutes: 2
inject:
  - kind: fault
    type: latency
    service: payments
    intensity: {delay_ms: 900, share: 1.0}
    duration: 10m
    after: 0s
expect:
  alert_within_seconds: 180
  service: payments
  fault_type: latency
  action: none
  action_if_restart_enabled: none
judge_reference: >
  Payments latency rose about 900 ms with no recent deploy; Orders latency rose only through its
  upstream calls to Payments while Orders' own DB signals stayed normal.
cleanup:
  clear_faults: true
  restore_release: false
  recovery_timeout_seconds: 300
