id: S06-orders-error-rate
description: Local 25% 5xx error rate on Orders while Payments stays healthy.
setup:
  baseline_minutes: 2
inject:
  - kind: fault
    type: error_rate
    service: orders
    intensity: {share: 0.25}
    duration: 10m
    after: 0s
expect:
  alert_within_seconds: 180
  service: orders
  fault_type: error_rate
  action: none
  action_if_restart_enabled: none
judge_reference: >
  Orders 5xx error ratio rose to ~25% with flat latency and no recent deploy; Payments error
  rate and Orders' upstream error ratio stayed normal.
cleanup:
  clear_faults: true
  restore_release: false
  recovery_timeout_seconds: 300
