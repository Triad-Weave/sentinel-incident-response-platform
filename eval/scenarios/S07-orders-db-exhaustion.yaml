id: S07-orders-db-exhaustion
description: Orders database connection pool exhausted (100% in use, acquire timeouts, readiness failure).
setup:
  baseline_minutes: 2
inject:
  - kind: fault
    type: db_exhaustion
    service: orders
    intensity: {connections: 5}
    duration: 10m
    after: 0s
expect:
  alert_within_seconds: 180
  service: orders
  fault_type: db_exhaustion
  action: none
  action_if_restart_enabled: restart
judge_reference: >
  Orders DB pool utilization reached 100% with rising pool wait times, acquire-timeout error logs,
  and readiness probe failures while Payments remained healthy.
cleanup:
  clear_faults: true
  restore_release: false
  recovery_timeout_seconds: 300
