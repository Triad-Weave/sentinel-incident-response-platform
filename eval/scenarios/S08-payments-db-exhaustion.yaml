id: S08-payments-db-exhaustion
description: Payments database connection pool exhausted, cascading timeouts and errors into Orders.
setup:
  baseline_minutes: 2
inject:
  - kind: fault
    type: db_exhaustion
    service: payments
    intensity: {connections: 5}
    duration: 10m
    after: 0s
expect:
  alert_within_seconds: 180
  service: payments
  fault_type: db_exhaustion
  action: none
  action_if_restart_enabled: restart
judge_reference: >
  Payments DB pool reached 100% saturation with acquire timeouts and readiness failures, cascading
  5xx/timeout errors upstream to Orders while Orders' own DB pool remained normal.
cleanup:
  clear_faults: true
  restore_release: false
  recovery_timeout_seconds: 300
