[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-eval"
version = "0.1.0"
description = "Shared eval-result v1 schema, CLI (validate/compare/push), and Eval Store (PB-15)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.28.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "jsonschema>=4.23.0",
]

[project.scripts]
platform-eval = "platform_eval.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["platform_eval*"]
