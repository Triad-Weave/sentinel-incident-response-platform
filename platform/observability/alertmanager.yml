# Platform Alertmanager routing by `project` label (PB-10)
global:
  resolve_timeout: 2m

route:
  receiver: default-blackhole
  group_by: [project, alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers:
        - project="sentinel"
      receiver: sentinel-webhook
      group_by: [alertname, service]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    - matchers:
        - project="lumen"
      receiver: lumen-webhook
    - matchers:
        - project="folio"
      receiver: folio-webhook

receivers:
  - name: default-blackhole

  - name: sentinel-webhook
    webhook_configs:
      - url: "http://sentinel-api:8000/api/v1/alerts/alertmanager"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: "dev-alertmanager-webhook-token"

  - name: lumen-webhook
    webhook_configs:
      - url: "http://lumen-api:8000/api/v1/alerts/webhook"
        send_resolved: true

  - name: folio-webhook
    webhook_configs:
      - url: "http://folio-api:8000/api/v1/alerts/webhook"
        send_resolved: true
