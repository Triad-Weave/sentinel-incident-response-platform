# Argo CD Applications for `shop`, `sentinel-chaos`, and `sentinel` (PB-06)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-orders
  namespace: argocd
  labels:
    project: sentinel
spec:
  project: default
  source:
    repoURL: https://github.com/cohort-platform/sentinel-gitops.git
    targetRevision: main
    path: charts/orders
    helm:
      valueFiles:
        - ../../apps/shop/orders/values.yaml
        - ../../apps/shop/orders/release.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
