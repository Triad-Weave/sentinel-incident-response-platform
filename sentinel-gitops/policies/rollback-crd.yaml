# Platform PB-07 RollbackRequest CustomResourceDefinition (request R-1, Architecture p.18)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rollbackrequests.platform.cohort.dev
spec:
  group: platform.cohort.dev
  names:
    kind: RollbackRequest
    listKind: RollbackRequestList
    plural: rollbackrequests
    singular: rollbackrequest
    shortNames: [rbreq]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [app, expectedCurrentRevision, reason]
              properties:
                app:
                  type: string
                expectedCurrentRevision:
                  type: string
                reason:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Succeeded, Failed]
                fromRevision:
                  type: string
                toRevision:
                  type: string
                gitCommit:
                  type: string
                message:
                  type: string
